# RBAC — ServiceAccounts and SCC bindings
# -----------------------------------------
# Creates dedicated ServiceAccounts for training workloads and grants them
# the anyuid Security Context Constraint (SCC) so that the NVIDIA NeMo
# container (which runs as root by default) can schedule on OpenShift.
#
# Pattern verified against OCP 4.x authentication and authorization docs:
# https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/authentication_and_authorization/managing-pod-security-policies
# https://docs.redhat.com/en/documentation/red_hat_openshift_pipelines/1.10/html/securing_openshift_pipelines/using-pods-in-a-privileged-security-context
#
# WHY anyuid for training pods:
#   nvcr.io/nvidia/nemo:25.09.01 runs as uid 0 (root) by default.
#   OpenShift's default restricted-v2 SCC does NOT permit root.
#   anyuid allows any UID including 0 while still blocking host-level
#   privileges (host network, host PID, host IPC, privileged containers).
#
# WHY NOT for the Notebook (workbench) CR:
#   The RHOAI Kubeflow Notebook Controller manages its own ServiceAccount
#   and SCC grant for workbench pods. The Notebook CR spec must NOT include
#   serviceAccountName or securityContext — the operator injects both.
#
# IMPORTANT: Creating the ClusterRole and RoleBinding requires cluster-admin.
#            The ServiceAccount creation requires only project admin rights.
#
# Do NOT modify the default SCCs. Per Red Hat docs:
#   "Customizing the default SCCs can lead to issues when some of the
#    platform pods deploy or OpenShift Container Platform is upgraded."
#
# Apply (cluster-admin required for ClusterRole and RoleBinding):
#   oc apply -f openshift/rbac/service-accounts.yaml -n <your-namespace>
#
# Verify:
#   oc get sa -n <your-namespace>
#   oc adm policy who-can use scc anyuid -n <your-namespace>

---
# ServiceAccount for PyTorchJob training pods.
# Referenced in training/pytorchjob.yaml spec.pytorchReplicaSpecs.*.template.spec.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nemo-tfm-training
  namespace: nemo-tfm
  labels:
    app: nemo-tfm

---
# ClusterRole that grants the 'use' verb on the anyuid SCC.
# A ClusterRole is required because SCCs are cluster-scoped resources.
# A namespace-scoped RoleBinding (below) constrains its effect to one project.
#
# Source pattern:
#   https://docs.redhat.com/en/documentation/red_hat_openshift_pipelines/1.10/html/securing_openshift_pipelines/using-pods-in-a-privileged-security-context
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nemo-tfm-anyuid-scc
  labels:
    app: nemo-tfm
rules:
  - apiGroups:
      - security.openshift.io
    resources:
      - securitycontextconstraints
    resourceNames:
      - anyuid
    verbs:
      - use

---
# RoleBinding: grants the nemo-tfm-training SA the anyuid SCC
# within this project namespace only.
# Using RoleBinding (not ClusterRoleBinding) scopes the SCC grant to one
# namespace, which is the least-privilege approach.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nemo-tfm-training-anyuid
  namespace: nemo-tfm
  labels:
    app: nemo-tfm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: nemo-tfm-anyuid-scc
subjects:
  - kind: ServiceAccount
    name: nemo-tfm-training
    namespace: nemo-tfm
