# Model Endpoint — InferenceService CR
# Wave 6: applied last; depends on the ServingRuntime (wave 5) existing first.
#
# KServe (v0.15 in RHOAI 3.3) reconciles this into a Deployment, Service,
# and Route. RawDeployment mode is the default in RHOAI 3.3.
#
# The model is loaded from the PVC containing the pretrained checkpoint
# (built by the pipeline or git-lfs-pulled manually).
#
# GPU: Do NOT set nvidia.com/gpu here — it is declared in the ServingRuntime.
# Conflicting GPU declarations cause scheduling errors.
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: nemo-tfm
  namespace: nemo-tfm
  labels:
    opendatahub.io/dashboard: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "6"
    openshift.io/display-name: "Transaction Foundation Model"
    # Required for KServe RawDeployment mode in RHOAI 3.3
    serving.kserve.io/deploymentMode: RawDeployment
spec:
  predictor:
    model:
      modelFormat:
        name: pytorch
        version: "2"
      runtime: nemo-tfm-serving-runtime
      # Model loaded from a PVC containing the pipeline-output checkpoint.
      # Update this path after the training pipeline has completed.
      storageUri: pvc://nemo-tfm-model-output/decoder-foundation-model
      # Do NOT set nvidia.com/gpu here — declared in ServingRuntime only
      resources:
        requests:
          cpu: "4"
          memory: 24Gi
        limits:
          cpu: "4"
          memory: 24Gi
