# ArgoCD SealedSecret manager Role + RoleBinding
# Wave 0: gives ArgoCD's application controller the ability to create and
# patch SealedSecret resources in nemo-tfm.
#
# The default OpenShift GitOps application controller ClusterRole does not
# include bitnami.com/sealedsecrets — it only covers core OpenShift and
# operator resource types. This Role fills that gap.
#
# BOOTSTRAPPING NOTE: Like argocd-admin.yaml, this must be applied before
# ArgoCD can manage SealedSecrets. On a fresh cluster, apply once:
#   oc apply -f openshift/gitops/rbac/argocd-sealedsecret-access.yaml -n nemo-tfm
# ArgoCD will adopt and maintain it on subsequent syncs.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argocd-sealedsecret-manager
  namespace: nemo-tfm
  annotations:
    argocd.argoproj.io/sync-wave: "0"
rules:
  - apiGroups: ["bitnami.com"]
    resources: ["sealedsecrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-sealedsecret-manager
  namespace: nemo-tfm
  annotations:
    argocd.argoproj.io/sync-wave: "0"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argocd-sealedsecret-manager
subjects:
  - kind: ServiceAccount
    name: openshift-gitops-argocd-application-controller
    namespace: openshift-gitops
