# OpenShift AI Workbench Secret — Template
# -----------------------------------------
# Injects runtime configuration into the RHOAI workbench pod as environment
# variables. Covers NGC access, S3-compatible model storage, and cluster refs.
#
# Copy to workbench-secret.yaml and populate before applying:
#   cp workbench-secret.template.yaml workbench-secret.yaml
#
# Encode each value:
#   echo -n 'your-actual-value' | base64
#
# Apply to the cluster:
#   oc apply -f workbench-secret.yaml -n <your-project-namespace>
#
# Then reference in your DataScienceProject / Workbench CR:
#   envFrom:
#     - secretRef:
#         name: workbench-runtime-secret
#
# workbench-secret.yaml is gitignored. Never commit it.

apiVersion: v1
kind: Secret
metadata:
  name: workbench-runtime-secret
  namespace: <your-project-namespace>
  labels:
    app: transaction-foundation-model
type: Opaque
data:
  # NGC API key (base64-encoded) — for nvcr.io image pulls and NGC CLI
  NGC_API_KEY: <base64-encoded-ngc-api-key>

  # S3-compatible model storage (base64-encoded)
  MODEL_REGISTRY_ENDPOINT: <base64-encoded-endpoint>
  MODEL_REGISTRY_ACCESS_KEY: <base64-encoded-access-key>
  MODEL_REGISTRY_SECRET_KEY: <base64-encoded-secret-key>
  MODEL_REGISTRY_BUCKET: <base64-encoded-bucket-name>

  # OpenShift AI API (base64-encoded)
  AI_PLATFORM_API_URL: <base64-encoded-rhoai-api-url>
