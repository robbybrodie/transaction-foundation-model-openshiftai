# Registry Pull Secret — Template
# --------------------------------
# Used to pull the NeMo container from nvcr.io (NVIDIA NGC).
#
# Copy to registry-credentials.yaml and populate before applying:
#   cp registry-credentials.template.yaml registry-credentials.yaml
#
# Then apply to the cluster:
#   oc apply -f registry-credentials.yaml -n <your-namespace>
#   oc secrets link default registry-pull-secret --for=pull -n <your-namespace>
#
# registry-credentials.yaml is gitignored. Never commit it.
#
# To generate the base64-encoded .dockerconfigjson value:
#   AUTH=$(echo -n '$oauthtoken:<your-ngc-api-key>' | base64 -w0)
#   echo '{"auths":{"nvcr.io":{"auth":"'$AUTH'"}}}' | base64 -w0

apiVersion: v1
kind: Secret
metadata:
  name: registry-pull-secret
  namespace: <your-project-namespace>
type: kubernetes.io/dockerconfigjson
data:
  # base64-encoded JSON: {"auths":{"nvcr.io":{"auth":"<base64(user:token)>"}}}
  .dockerconfigjson: <base64-encoded-dockerconfigjson-here>
