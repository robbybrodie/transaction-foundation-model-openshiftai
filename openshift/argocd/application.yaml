# ArgoCD Application — deploys the full nemo-tfm project from Git.
#
# Prerequisites (apply once as cluster-admin before this file):
#   oc apply -f openshift/gitops-install/gitops-subscription.yaml
#   # Wait ~3 min for ArgoCD pods to be Running in openshift-gitops:
#   oc get pods -n openshift-gitops
#
# Then deploy:
#   oc apply -f openshift/argocd/application.yaml
#
# Monitor sync:
#   oc get application nemo-tfm -n openshift-gitops
#   # Or open the ArgoCD UI:
#   oc get route openshift-gitops-server -n openshift-gitops -o jsonpath='{.spec.host}'
#
# Teardown:
#   oc delete application nemo-tfm -n openshift-gitops  # stops reconciliation
#   oc delete project nemo-tfm                           # removes all resources
#
# Notes:
# - path: openshift/gitops  (NOT openshift/) — only infrastructure and workbench
#   resources are auto-synced. Explicitly excluded:
#     openshift/training/   — PyTorchJob, run manually after workbench is ready
#     openshift/serving/    — ServingRuntime + InferenceService, applied manually
#                             once a trained model checkpoint is available
#   Serving is excluded because KServe reconciles the InferenceService into a
#   Deployment immediately; with an empty model PVC the predictor crash-loops and
#   the ArgoCD app reports Degraded health permanently. See openshift/serving/ for
#   manifests to apply once your model is ready.
# - CreateNamespace=false: namespace.yaml (wave -1) manages the Namespace CR.
# - ServerSideApply=true: required for the SA imagePullSecrets patches in
#   rbac/sa-pull-secrets.yaml to merge with platform-managed fields.
# - prune+selfHeal: ArgoCD removes resources deleted from Git and corrects drift.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nemo-tfm
  namespace: openshift-gitops
  labels:
    app: nemo-tfm
spec:
  project: default

  source:
    repoURL: https://github.com/robbybrodie/transaction-foundation-model-openshiftai
    targetRevision: openshiftai-integration
    path: openshift/gitops
    directory:
      recurse: true

  destination:
    server: https://kubernetes.default.svc
    namespace: nemo-tfm

  # Suppress perpetual drift caused by OpenShift platform controllers
  # adding fields ArgoCD doesn't own:
  #   - ServiceAccount: OpenShift adds default-dockercfg-* to imagePullSecrets/secrets
  #   - BuildConfig:    OpenShift build controller sets lastTriggeredImageID in triggers
  # With ServerSideApply=true ArgoCD still writes (owns) its desired fields;
  # ignoreDifferences only prevents it from flagging the extra platform fields as drift.
  ignoreDifferences:
    - kind: ServiceAccount
      jsonPointers:
        - /imagePullSecrets
        - /secrets
    - kind: BuildConfig
      group: build.openshift.io
      jsonPointers:
        - /spec/triggers

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # Do not create the namespace — namespace.yaml (wave -1) owns it
      - CreateNamespace=false
      # Required for SA imagePullSecrets patches to merge cleanly
      - ServerSideApply=true
      # Apply resources in sync-wave order
      - RespectIgnoreDifferences=true
