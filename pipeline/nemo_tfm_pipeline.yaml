          memoryRequest: 16.0
          resourceCpuRequest: '4'
          resourceMemoryRequest: 16G
pipelineInfo:
  description: 'End-to-end NeMo decoder foundation model: data prep -> tokenisation
    -> pre-training -> embedding extraction -> fraud detection'
  name: nemo-transaction-foundation-model
root:
  dag:
    tasks:
      dataset-baseline:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-dataset-baseline
        inputs:
          parameters:
            work_dir:
              componentInputParameter: work_dir
        taskInfo:
          name: dataset-baseline
      foundation-model-training:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-foundation-model-training
        dependentTasks:
        - seq-preproc-tokenization
        inputs:
          parameters:
            prev:
              taskOutputParameter:
                outputParameterKey: Output
                producerTask: seq-preproc-tokenization
            work_dir:
              componentInputParameter: work_dir
        taskInfo:
          name: foundation-model-training
      inference-embedding-extraction:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-inference-embedding-extraction
        dependentTasks:
        - foundation-model-training
        inputs:
          parameters:
            prev:
              taskOutputParameter:
                outputParameterKey: Output
