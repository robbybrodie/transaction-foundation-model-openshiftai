          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef extract_embeddings(\n    work_dir:    str,\n    model_path: \
          \ str  = \"models/decoder-foundation-model\",\n    force_rerun: bool = False,\n\
          ) -> str:\n    \"\"\"Extract 512-d last-token embeddings from the decoder\
          \ model.\n\n    True decorated component -- calls src/ directly.\n    Contrast\
          \ with nemo_tfm_pipeline.py which uses papermill to run the\n    equivalent\
          \ notebook (04_inference_embedding_extraction.ipynb).\n\n    Runs GPU-accelerated\
          \ cuDF tokenisation + HuggingFaceDecoderInference\n    batch inference for\
          \ all three splits:\n      - train:  balanced ~1M sample (10% fraud, seed=42,\
          \ matching notebook 05)\n      - val:    100K stratified subset from val_eval.parquet\n\
          \      - test:   100K stratified subset from test_eval.parquet\n\n    Row\
          \ IDs are preserved before preprocess() sorts by user/card/time, so\n  \
          \  raw feature alignment in evaluate_fraud_detection is exact.\n\n    LFS\
          \ smudge logic: if models/decoder-foundation-model/ contains pointer\n \
          \   files (133-byte git-lfs stubs rather than real safetensors), the real\n\
          \    blobs are fetched from GitHub LFS automatically before inference. This\n\
          \    logic is copied verbatim from inference_embedding_extraction in\n \
          \   nemo_tfm_pipeline.py so behaviour is identical in both pipelines.\n\n\
          \    Better than papermill: model_path is an explicit typed input -- if\
          \ you\n    evaluate a different checkpoint the decision is recorded in the\
          \ run's\n    lineage. The papermill version buries the model path in a notebook\
          \ cell.\n\n    Parameters\n    ----------\n    work_dir   : str -- repo\
          \ root on the shared PVC\n    model_path : str -- relative or absolute path\
          \ to the model checkpoint.\n                       Default: models/decoder-foundation-model/\
          \ (Git LFS,\n                       3000-step NVIDIA checkpoint). In both\
          \ demo and train\n                       modes this default is used -- training\
          \ output is separate.\n\n    Returns\n    -------\n    str\n        Absolute\
          \ path to data/embeddings/ on the shared PVC.\n    \"\"\"\n    import glob\n\
          \    import json\n    import os\n    import sys\n    import subprocess\n\
          \    import time\n\n    import numpy as np\n\n    # True decorated component\
          \ -- calls src/ directly.\n    sys.path.insert(0, work_dir)\n    os.environ[\"\
          HOME\"] = \"/tmp\"\n\n    # Resolve model_path relative to work_dir if not\
          \ absolute\n    if not os.path.isabs(model_path):\n        model_path =\
          \ os.path.join(work_dir, model_path)\n\n    if force_rerun:\n        import\
          \ shutil\n        embed_dir_to_clear = os.path.join(work_dir, \"data\",\
          \ \"embeddings\")\n        if os.path.exists(embed_dir_to_clear):\n    \
          \        shutil.rmtree(embed_dir_to_clear)\n            os.makedirs(embed_dir_to_clear,\
          \ exist_ok=True)\n            print(\"force_rerun=True -- cleared existing\
          \ embeddings\")\n\n    # ------------------------------------------------------------------\n\
          \    # LFS smudge: detect pointer files and download real safetensors blobs.\n\
          \    # Copied verbatim from inference_embedding_extraction in nemo_tfm_pipeline.py\n\
          \    # -- behaviour is identical in both pipelines. Do not modify independently.\n\
          \    # ------------------------------------------------------------------\n\
          \    LFS_REPO = (\n        \"https://github.com/robbybrodie/\"\n       \
          \ \"transaction-foundation-model-openshiftai.git\"\n    )\n    for model_file\
          \ in glob.glob(os.path.join(model_path, \"*.safetensors\")):\n        with\
          \ open(model_file, \"rb\") as _f:\n            header = _f.read(50)\n  \
          \      if not header.startswith(b\"version https://git-lfs\"):\n       \
          \     continue\n        with open(model_file, encoding=\"utf-8\") as _f:\n\
          \            pointer_text = _f.read()\n        oid = next(\n           \
          \ line.split(\"sha256:\")[1].strip()\n            for line in pointer_text.splitlines()\n\
          \            if line.startswith(\"oid \")\n        )\n        size = int(next(\n\
          \            line.split()[1]\n            for line in pointer_text.splitlines()\n\
          \            if line.startswith(\"size \")\n        ))\n        print(\n\
          \            f\"LFS pointer detected: {os.path.basename(model_file)} \"\n\
          \            f\"({size:,} bytes). Fetching real blob...\"\n        )\n \
          \       batch_body = json.dumps({\n            \"operation\": \"download\"\
          ,\n            \"transfers\": [\"basic\"],\n            \"objects\": [{\"\
          oid\": oid, \"size\": size}],\n        })\n        batch_result = subprocess.run(\n\
          \            [\n                \"curl\", \"-s\", \"-X\", \"POST\",\n  \
          \              \"-H\", \"Content-Type: application/vnd.git-lfs+json\",\n\
          \                \"-H\", \"Accept: application/vnd.git-lfs+json\",\n   \
          \             f\"{LFS_REPO}/info/lfs/objects/batch\",\n                \"\
          -d\", batch_body,\n            ],\n            capture_output=True, text=True,\
          \ check=True,\n        )\n        batch_resp = json.loads(batch_result.stdout)\n\
          \        download_url = batch_resp[\"objects\"][0][\"actions\"][\"download\"\
          ][\"href\"]\n        print(f\"Downloading {os.path.basename(model_file)}...\"\
          )\n        subprocess.run([\"curl\", \"-L\", \"-o\", model_file, download_url],\
          \ check=True)\n        print(f\"Smudged: {os.path.basename(model_file)}\
          \ = {os.path.getsize(model_file):,} bytes\")\n\n    # ------------------------------------------------------------------\n\
          \    # Initialise tokeniser and model\n    # ------------------------------------------------------------------\n\
          \    import cudf\n    from src.tokenizer import FinancialTokenizerPipeline,\
          \ FinancialTabularTokenizer\n    from src.decoder_inference import HuggingFaceDecoderInference\n\
          \n    BATCH_SIZE          = 1024\n    MAX_LENGTH          = 128\n    MERCHANT_HASH_SIZE\
          \  = 2000\n    BALANCED_TRAIN_SIZE = 1_000_000\n\n    tokenizer = FinancialTabularTokenizer(\n\
          \        merchant_hash_size=MERCHANT_HASH_SIZE,\n        category_hierarchy=True,\n\
          \        temporal_encoding=True,\n    )\n    inference = HuggingFaceDecoderInference(\n\
          \        model_path=model_path,\n        tokenizer=tokenizer,\n        pooling=\"\
          last_token\",\n    )\n    print(f\"Model: {inference.device}, embed_dim={inference.embedding_dim}\"\
          )\n\n    temporal_dir = os.path.join(work_dir, \"data\", \"TabFormer\",\
          \ \"temporal_split\")\n    embed_dir    = os.path.join(work_dir, \"data\"\
          , \"embeddings\")\n    os.makedirs(embed_dir, exist_ok=True)\n\n    split_to_parquet\
          \ = {\n        \"train\": \"train.parquet\",\n        \"val\":   \"val_eval.parquet\"\
          ,\n        \"test\":  \"test_eval.parquet\",\n    }\n\n    all_embeddings\
          \ = []\n    all_labels     = []\n    split_sizes    = {}\n\n    for split\
          \ in (\"train\", \"val\", \"test\"):\n        embed_path  = os.path.join(embed_dir,\
          \ f\"{split}_embeddings.npy\")\n        label_path  = os.path.join(embed_dir,\
          \ f\"{split}_labels.npy\")\n        row_id_path = os.path.join(embed_dir,\
          \ f\"{split}_row_ids.npy\")\n\n        if os.path.exists(embed_path) and\
          \ os.path.exists(label_path):\n            emb = np.load(embed_path)\n \
          \           lbl = np.load(label_path)\n            print(f\"[{split}] Already\
          \ extracted: {emb.shape}, {lbl.sum():,} fraud -- skipping\")\n         \
          \   all_embeddings.append(emb)\n            all_labels.append(lbl)\n   \
          \         split_sizes[split] = len(emb)\n            continue\n\n      \
          \  parquet_path = os.path.join(temporal_dir, split_to_parquet[split])\n\
          \        print(f\"\\n{'='*60}\\nExtracting {split} embeddings\\n{'='*60}\"\
          )\n\n        t0  = time.time()\n        gdf = cudf.read_parquet(parquet_path)\n\
          \n        # Extract labels before preprocess() renames columns\n       \
          \ labels = None\n        for col in [\"Is Fraud?\", \"is_fraud\", \"Is_Fraud\"\
          , \"label\", \"fraud\"]:\n            if col in gdf.columns:\n         \
          \       lbl_series = gdf[col].to_pandas()\n                if lbl_series.dtype\
          \ == object:\n                    labels = ((lbl_series == \"Yes\") | (lbl_series\
          \ == \"1\")).astype(int).values\n                else:\n               \
          \     labels = lbl_series.astype(int).values\n                print(f\"\
          \  Labels from '{col}': {labels.sum():,} fraud / {len(labels):,}\")\n  \
          \              break\n\n        # Balanced sampling for train -- must match\
          \ notebook 05 (deterministic seed)\n        if split == \"train\" and labels\
          \ is not None:\n            fraud_idx  = np.where(labels == 1)[0]\n    \
          \        normal_idx = np.where(labels == 0)[0]\n            np.random.seed(42)\n\
          \            n_fraud  = min(len(fraud_idx),  int(BALANCED_TRAIN_SIZE * 0.1))\n\
          \            n_normal = min(len(normal_idx), BALANCED_TRAIN_SIZE - n_fraud)\n\
          \            sampled  = np.concatenate([\n                np.random.choice(fraud_idx,\
          \  n_fraud,  replace=False),\n                np.random.choice(normal_idx,\
          \ n_normal, replace=False),\n            ])\n            np.random.shuffle(sampled)\n\
          \            gdf    = gdf.iloc[sampled].reset_index(drop=True)\n       \
          \     labels = labels[sampled]\n            print(f\"  Balanced: {len(gdf):,}\
          \ rows, {labels.sum():,} fraud ({labels.mean():.1%})\")\n\n        # Preserve\
          \ row IDs so raw features can be aligned after preprocess() sorts rows\n\
          \        gdf[\"__row_id__\"] = np.arange(len(gdf), dtype=np.int64)\n\n \
          \       pip     = FinancialTokenizerPipeline(merchant_hash_size=MERCHANT_HASH_SIZE)\n\
          \        gdf     = pip.preprocess(gdf)\n        row_ids = gdf[\"__row_id__\"\
          ].to_pandas().to_numpy(dtype=np.int64)\n        if labels is not None:\n\
          \            labels = labels[row_ids]\n        pip.fit(gdf)\n        token_df\
          \   = pip.transform(gdf)\n        padded_ids = pip.encode(token_df, max_length=MAX_LENGTH)\n\
          \        print(f\"  Tokenized {len(padded_ids):,} rows in {time.time()-t0:.1f}s\"\
          )\n\n        t0  = time.time()\n        emb = inference.extract_embeddings_batched(\n\
          \            padded_ids, batch_size=BATCH_SIZE, show_progress=True\n   \
          \     )\n        print(f\"  Extracted {emb.shape} in {time.time()-t0:.1f}s\"\
          )\n\n        np.save(embed_path, emb)\n        if labels is not None:\n\
          \            np.save(label_path, labels)\n        np.save(row_id_path, row_ids)\n\
          \n        all_embeddings.append(emb)\n        all_labels.append(labels if\
          \ labels is not None else np.zeros(len(emb), dtype=np.int8))\n        split_sizes[split]\
          \ = len(emb)\n\n    # ------------------------------------------------------------------\n\
          \    # Save concatenated embeddings + metadata.json\n    # ------------------------------------------------------------------\n\
          \    embeddings_all = np.concatenate(all_embeddings)\n    labels_all   \
          \  = np.concatenate(all_labels)\n    np.save(os.path.join(embed_dir, \"\
          embeddings.npy\"), embeddings_all)\n    np.save(os.path.join(embed_dir,\
          \ \"labels.npy\"),     labels_all)\n\n    metadata = {\n        \"backend\"\
          :           \"huggingface_decoder\",\n        \"pooling\":           \"\
          last_token\",\n        \"model_path\":        str(model_path),\n       \
          \ \"n_samples\":         len(embeddings_all),\n        \"embedding_dim\"\
          :     int(embeddings_all.shape[1]),\n        \"batch_size\":        BATCH_SIZE,\n\
          \        \"max_length\":        MAX_LENGTH,\n        \"splits\":       \
          \     [\"train\", \"val\", \"test\"],\n        \"n_train\":           split_sizes.get(\"\
          train\", 0),\n        \"n_val\":             split_sizes.get(\"val\",  \
          \ 0),\n        \"n_test\":            split_sizes.get(\"test\",  0),\n \
          \       \"row_id_alignment\":  \"explicit_split_row_ids\",\n    }\n    with\
          \ open(os.path.join(embed_dir, \"metadata.json\"), \"w\") as f:\n      \
          \  json.dump(metadata, f, indent=2)\n\n    print(f\"\\nAll embeddings saved\
          \ to {embed_dir}\")\n    for k, v in split_sizes.items():\n        print(f\"\
          \  {k}: {v:,}\")\n\n    return embed_dir\n\n"
        env:
