        parameterType: STRING
      model_path:
        defaultValue: models/decoder-foundation-model
        description: 'Default: models/decoder-foundation-model/ (Git LFS,

          3000-step NVIDIA checkpoint). Relative paths are resolved

          from work_dir inside extract_embeddings.'
        isOptional: true
        parameterType: STRING
      work_dir:
        defaultValue: /opt/app-root/src/nemo-tfm
        isOptional: true
        parameterType: STRING
