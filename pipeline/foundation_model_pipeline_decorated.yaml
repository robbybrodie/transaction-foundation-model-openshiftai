    exec-prepare-dataset:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - prepare_dataset
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.13.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef prepare_dataset(\n    work_dir:    str,\n    force_rerun: bool\
          \ = False,\n) -> str:\n    \"\"\"Download TabFormer dataset and create temporal\
          \ train/val/test splits.\n\n    True decorated component -- CPU only, no\
          \ GPU required.\n    Replaces the data preparation portion of notebook 01\n\
          \    (01_dataset_baseline.ipynb). Does NOT run the XGBoost baseline --\n\
          \    that is computed inside evaluate_fraud_detection alongside the\n  \
          \  embedding model for a fair comparison.\n\n    What this does:\n    -\
          \ Downloads transactions.tgz from IBM Box if not present\n    - Extracts\
          \ card_transaction.v1.csv to data/TabFormer/raw/\n    - Creates 80/10/10\
          \ temporal splits by cumulative row count\n      (same logic as notebook\
          \ 01 -- cutoff dates derived from\n      find_cutoff_date at 0.8 and 0.9\
          \ cumulative ratios)\n    - Writes train.parquet, val.parquet, test.parquet\n\
          \    - Writes val_eval.parquet, test_eval.parquet\n      (100K stratified\
          \ subsets, random_state=42, used by\n      extract_embeddings and evaluate_fraud_detection)\n\
          \n    All parquets are written in raw format (Amount still has $,\n    Time\
          \ is still a string) -- identical to what notebook 01 saves.\n\n    Idempotent:\
          \ if train.parquet exists and force_rerun=False,\n    returns immediately\
          \ without re-downloading or re-splitting.\n\n    Better than papermill:\
          \ the split directory path is a typed return\n    value recorded in KFP\
          \ metadata store. The notebook version writes\n    wherever the cell says\
          \ with no typed contract visible to downstream\n    steps.\n\n    Parameters\n\
          \    ----------\n    work_dir    : str  -- repo root on the shared PVC\n\
          \    force_rerun : bool -- False: skip if splits already exist\n       \
          \                  True: delete and regenerate all splits\n\n    Returns\n\
          \    -------\n    str\n        Absolute path to data/TabFormer/temporal_split/\n\
          \    \"\"\"\n    import os\n    import sys\n    import tarfile\n    import\
          \ time\n    from urllib.request import urlretrieve\n\n    sys.path.insert(0,\
          \ work_dir)\n    os.environ[\"HOME\"] = \"/tmp\"\n\n    split_dir     =\
          \ os.path.join(work_dir, \"data\", \"TabFormer\", \"temporal_split\")\n\
          \    train_parquet = os.path.join(split_dir, \"train.parquet\")\n\n    if\
          \ force_rerun and os.path.exists(split_dir):\n        import shutil\n  \
          \      shutil.rmtree(split_dir)\n        print(\"force_rerun=True -- cleared\
          \ existing splits\")\n\n    if os.path.exists(train_parquet):\n        import\
          \ pandas as pd\n        n = len(pd.read_parquet(train_parquet))\n      \
          \  print(f\"Splits already exist: {n:,} train rows -- skipping\")\n    \
          \    return split_dir\n\n    # ------------------------------------------------------------------\n\
          \    # Download and extract\n    # ------------------------------------------------------------------\n\
          \    raw_dir  = os.path.join(work_dir, \"data\", \"TabFormer\", \"raw\"\
          )\n    os.makedirs(raw_dir, exist_ok=True)\n    tgz_path = os.path.join(work_dir,\
          \ \"data\", \"TabFormer\", \"transactions.tgz\")\n    csv_path = os.path.join(raw_dir,\
          \ \"card_transaction.v1.csv\")\n\n    DOWNLOAD_URL = (\n        \"https://ibm.ent.box.com/index.php\"\
          \n        \"?rm=box_download_shared_file\"\n        \"&shared_name=mhrtz6xiknblqznoi9h4f390scoqustt\"\
          \n        \"&file_id=f_770766751708\"\n    )\n\n    if not os.path.exists(tgz_path):\n\
          \        print(\"Downloading transactions.tgz from IBM Box (~2.2 GB)...\"\
          )\n        t0 = time.time()\n        urlretrieve(DOWNLOAD_URL, tgz_path)\n\
          \        print(f\"  Downloaded in {time.time()-t0:.1f}s\")\n\n    if not\
          \ os.path.exists(csv_path):\n        print(\"Extracting transactions.tgz...\"\
          )\n        with tarfile.open(tgz_path, \"r:gz\") as tar:\n            tar.extractall(path=raw_dir)\n\
          \        print(f\"  Extracted: {csv_path}\")\n\n    print(f\"Dataset ready:\
          \ {csv_path}\")\n\n    # ------------------------------------------------------------------\n\
          \    # Load (pandas -- CPU component, no cuDF dependency)\n    # ------------------------------------------------------------------\n\
          \    import numpy as np\n    import pandas as pd\n    from sklearn.model_selection\
          \ import train_test_split\n\n    TRAIN_RATIO  = 0.8\n    VAL_RATIO    =\
          \ 0.1\n    EVAL_SAMPLES = 100_000\n    RANDOM_STATE = 42\n\n    print(\"\
          Loading card_transaction.v1.csv with pandas...\")\n    t0 = time.time()\n\
          \    raw_df = pd.read_csv(csv_path)\n    raw_df.columns = [c.strip() for\
          \ c in raw_df.columns]   # match notebook 01 cell-12\n    print(f\"  Loaded\
          \ {len(raw_df):,} rows x {raw_df.shape[1]} cols in {time.time()-t0:.1f}s\"\
          )\n\n    # ------------------------------------------------------------------\n\
          \    # Temporal split -- direct port of notebook 01 find_cutoff_date logic.\n\
          \    # 80/10/10 by cumulative transaction count, not by fixed date.\n  \
          \  # ------------------------------------------------------------------\n\
          \    print(\"Building temporal splits (80/10/10 by cumulative row count)...\"\
          )\n    t0 = time.time()\n\n    year_s  = raw_df['Year'].astype(str)\n  \
          \  month_s = raw_df['Month'].astype(str).str.zfill(2)\n    day_s   = raw_df['Day'].astype(str).str.zfill(2)\n\
          \    raw_df['date'] = pd.to_datetime(\n        year_s + '-' + month_s +\
          \ '-' + day_s, format='%Y-%m-%d'\n    )\n\n    def find_cutoff_date(df,\
          \ target_ratio):\n        \"\"\"First date where cumulative row count >=\
          \ target_ratio * total.\n        Direct port of notebook 01 find_cutoff_date.\"\
          \"\"\n        daily = (df.groupby('date')\n                   .size()\n\
          \                   .reset_index(name='count')\n                   .sort_values('date'))\n\
          \        daily['cumulative'] = daily['count'].cumsum()\n        total  =\
          \ int(daily['cumulative'].iloc[-1])\n        target = total * target_ratio\n\
          \        return daily.loc[daily['cumulative'] >= target, 'date'].iloc[0]\n\
          \n    train_cutoff = find_cutoff_date(raw_df, TRAIN_RATIO)\n    test_cutoff\
          \  = find_cutoff_date(raw_df, TRAIN_RATIO + VAL_RATIO)\n    print(f\"  Train/Val\
          \ cutoff: {train_cutoff.strftime('%Y-%m-%d')}\")\n    print(f\"  Val/Test\
          \  cutoff: {test_cutoff.strftime('%Y-%m-%d')}\")\n\n    train_mask = raw_df['date']\
          \ < train_cutoff\n    val_mask   = (raw_df['date'] >= train_cutoff) & (raw_df['date']\
          \ < test_cutoff)\n    test_mask  = raw_df['date'] >= test_cutoff\n\n   \
          \ train_df = raw_df[train_mask].drop(columns=['date']).reset_index(drop=True)\n\
          \    val_df   = raw_df[val_mask].drop(columns=['date']).reset_index(drop=True)\n\
          \    test_df  = raw_df[test_mask].drop(columns=['date']).reset_index(drop=True)\n\
          \    del raw_df\n    print(f\"  Split time: {time.time()-t0:.1f}s\")\n\n\
          \    total = len(train_df) + len(val_df) + len(test_df)\n    for name, df\
          \ in [('Train', train_df), ('Val', val_df), ('Test', test_df)]:\n      \
          \  n     = len(df)\n        fraud = int(((df['Is Fraud?'] == 'Yes') | (df['Is\
          \ Fraud?'] == '1')).sum())\n        print(f\"  {name:<6} {n:>12,}  ({n/total*100:.1f}%)\
          \  fraud {fraud:,}  ({fraud/n:.4%})\")\n\n    # ------------------------------------------------------------------\n\
          \    # Save train / val / test parquets (raw format, no feature engineering)\n\
          \    # ------------------------------------------------------------------\n\
          \    os.makedirs(split_dir, exist_ok=True)\n    t0 = time.time()\n    for\
          \ name, df in [('train', train_df), ('val', val_df), ('test', test_df)]:\n\
          \        path = os.path.join(split_dir, f'{name}.parquet')\n        df.to_parquet(path,\
          \ index=False)\n        print(f\"  Saved {name}.parquet ({len(df):,} rows)\"\
          )\n    print(f\"  Write time: {time.time()-t0:.1f}s\")\n\n    # ------------------------------------------------------------------\n\
          \    # val_eval and test_eval -- 100K stratified subsets.\n    # Mirrors\
          \ notebook 01 section 5: stratified_subsample uses\n    # train_test_split(...,\
          \ stratify=_target, test_size=100_000,\n    # random_state=42) then saves\
          \ the raw rows (before feature\n    # engineering) at the sampled positional\
          \ indices.\n    # val_eval and test_eval are used by extract_embeddings\
          \ and\n    # evaluate_fraud_detection; the full val/test parquets are used\n\
          \    # by tokenize_transactions for corpus generation.\n    # ------------------------------------------------------------------\n\
          \    print(f\"\\nCreating {EVAL_SAMPLES:,}-row stratified eval subsets...\"\
          )\n\n    def stratified_subsample_idx(df, n_samples, random_state):\n  \
          \      \"\"\"Return positional indices of a stratified sample.\n       \
          \ Stratify on binary fraud flag (mirrors notebook 01 _target logic).\"\"\
          \"\n        target = ((df['Is Fraud?'] == 'Yes') | (df['Is Fraud?'] == '1')).astype(int)\n\
          \        if n_samples >= len(df):\n            return df.index.to_numpy()\n\
          \        _, sampled_idx = train_test_split(\n            df.index,\n   \
          \         test_size=n_samples,\n            stratify=target,\n         \
          \   random_state=random_state,\n        )\n        return sampled_idx\n\n\
          \    for split_name, full_df in [('val_eval', val_df), ('test_eval', test_df)]:\n\
          \        idx    = stratified_subsample_idx(full_df, EVAL_SAMPLES, RANDOM_STATE)\n\
          \        subset = full_df.iloc[idx].reset_index(drop=True)\n        out\
          \    = os.path.join(split_dir, f'{split_name}.parquet')\n        subset.to_parquet(out,\
          \ index=False)\n        fraud  = int(((subset['Is Fraud?'] == 'Yes') | (subset['Is\
          \ Fraud?'] == '1')).sum())\n        print(f\"  Saved {split_name}.parquet:\
          \ {len(subset):,} rows \"\n              f\"(fraud {fraud:,}, {fraud/len(subset):.4%})\"\
          )\n\n    print(f\"\\nAll splits saved to {split_dir}\")\n    return split_dir\n\
          \n"
        env:
        - name: HOME
          value: /tmp
        image: image-registry.openshift-image-registry.svc:5000/nemo-tfm/nemo-tfm-workbench:latest
        resources:
          cpuRequest: 2.0
          memoryRequest: 16.0
          resourceCpuRequest: '2'
          resourceMemoryRequest: 16G
    exec-tokenize-transactions:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - tokenize_transactions
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.13.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef tokenize_transactions(work_dir: str, force_rerun: bool = False)\
          \ -> str:\n    \"\"\"Run the GPU-accelerated financial tokeniser and write\
          \ text corpora.\n\n    True decorated component -- calls src/ directly.\n\
          \    Contrast with nemo_tfm_pipeline.py which uses papermill to run the\n\
          \    equivalent notebook (02_seq_preproc_tokenization.ipynb).\n\n    Reads\
          \ the temporal splits from data/TabFormer/temporal_split/ (produced\n  \
          \  by notebook 01), runs FinancialTokenizerPipeline.preprocess() to derive\n\
          \    the 12 pipeline columns, then calls fit_transform() and to_corpus_lines()\n\
          \    to produce text sequences in the format expected by NeMo AutoModel:\n\
          \n        <bos> AMT_3 MERCH_1498 CAT_RETAIL ... CUST_42 <sep> AMT_1 ...\
          \ <eos>\n\n    Each line is ~315 transactions (~4096 tokens at 12 tok/txn\
          \ + separators),\n    matching the model's context window. Three corpus\
          \ files are written:\n    train_corpus.txt, val_corpus.txt, test_corpus.txt.\n\
          \n    Better than papermill: the corpus directory path is a typed return\
          \ value\n    recorded in KFP's metadata store. The notebook version writes\
          \ wherever\n    the cell says, with no typed contract visible to downstream\
          \ steps.\n\n    Returns\n    -------\n    str\n        Absolute path to\
          \ data/decoder_corpus/ on the shared PVC.\n    \"\"\"\n    import os\n \
          \   import sys\n    import time\n\n    # True decorated component -- calls\
          \ src/ directly.\n    sys.path.insert(0, work_dir)\n    os.environ[\"HOME\"\
          ] = \"/tmp\"\n\n    import cudf\n    from src.tokenizer import FinancialTokenizerPipeline\n\
          \n    MERCHANT_HASH_SIZE = 2000\n    CHUNK_SIZE = 315  # ~4096 tokens at\
          \ 12 tokens/txn + separators\n\n    temporal_dir = os.path.join(work_dir,\
          \ \"data\", \"TabFormer\", \"temporal_split\")\n    corpus_dir   = os.path.join(work_dir,\
          \ \"data\", \"decoder_corpus\")\n\n    if force_rerun and os.path.exists(corpus_dir):\n\
          \        import shutil\n        shutil.rmtree(corpus_dir)\n        print(\"\
          force_rerun=True -- cleared existing corpus\")\n\n    os.makedirs(corpus_dir,\
          \ exist_ok=True)\n\n    splits = [\n        (\"train\", os.path.join(temporal_dir,\
          \ \"train.parquet\"),\n                  os.path.join(corpus_dir, \"train_corpus.txt\"\
          )),\n        (\"val\",   os.path.join(temporal_dir, \"val.parquet\"),\n\
          \                  os.path.join(corpus_dir, \"val_corpus.txt\")),\n    \
          \    (\"test\",  os.path.join(temporal_dir, \"test.parquet\"),\n       \
          \           os.path.join(corpus_dir, \"test_corpus.txt\")),\n    ]\n\n \
          \   for split_name, parquet_path, corpus_path in splits:\n        if os.path.exists(corpus_path):\n\
          \            n_lines = sum(1 for _ in open(corpus_path))\n            print(f\"\
          [{split_name}] Corpus already exists: {n_lines:,} sequences -- skipping\"\
          )\n            continue\n\n        print(f\"\\n{'='*60}\")\n        print(f\"\
          Generating corpus for {split_name}\")\n        print(f\"{'='*60}\")\n\n\
          \        t0 = time.time()\n        gdf = cudf.read_parquet(parquet_path)\n\
          \        print(f\"  Loaded {len(gdf):,} rows in {time.time()-t0:.1f}s\"\
          )\n\n        pip = FinancialTokenizerPipeline(merchant_hash_size=MERCHANT_HASH_SIZE)\n\
          \        gdf_proc = pip.preprocess(gdf)\n        pip.fit(gdf_proc)\n   \
          \     token_df = pip.transform(gdf_proc)\n\n        # Identify group columns\
          \ for chunking by (user, card)\n        group_cols = []\n        for col_name\
          \ in [\"user\", \"User\", \"cust\"]:\n            if col_name in gdf_proc.columns:\n\
          \                group_cols.append(col_name)\n                break\n  \
          \      for col_name in [\"card\", \"Card\", \"card_id\"]:\n            if\
          \ col_name in gdf_proc.columns:\n                group_cols.append(col_name)\n\
          \                break\n        if not group_cols:\n            group_cols\
          \ = [gdf_proc.columns[0]]\n\n        corpus_lines = pip.to_corpus_lines(\n\
          \            token_df, gdf_proc, group_cols, chunk_size=CHUNK_SIZE\n   \
          \     )\n\n        with open(corpus_path, \"w\") as f:\n            for\
          \ line in corpus_lines:\n                f.write(line + \"\\n\")\n\n   \
          \     elapsed = time.time() - t0\n        print(f\"  Generated {len(corpus_lines):,}\
          \ sequences in {elapsed:.1f}s\")\n        print(f\"  Saved -> {corpus_path}\"\
          )\n\n    return corpus_dir\n\n"
        env:
        - name: HOME
          value: /tmp
        image: image-registry.openshift-image-registry.svc:5000/nemo-tfm/nemo-tfm-workbench:latest
        resources:
          accelerator:
            count: '1'
            resourceCount: '1'
            resourceType: nvidia.com/gpu
            type: nvidia.com/gpu
          cpuRequest: 4.0
          memoryRequest: 32.0
          resourceCpuRequest: '4'
          resourceMemoryRequest: 32G
    exec-train-foundation-model:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - train_foundation_model
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.13.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef train_foundation_model(\n    work_dir:    str,\n    corpus_dir:\
          \  str,\n    config_path: str  = \"configs/pretrain_financial_decoder.yaml\"\
          ,\n    max_steps:   int  = 30,\n    force_rerun: bool = False,\n) -> str:\n\
          \    \"\"\"Run NeMo decoder pretraining via torchrun.\n\n    True decorated\
          \ component -- calls src/ directly.\n    Contrast with nemo_tfm_pipeline.py\
          \ which uses papermill to run the\n    equivalent notebook (03_foundation_model_training.ipynb).\n\
          \n    Wraps torchrun --nproc-per-node=1 around scripts/train_decoder_model.py,\n\
          \    passing the supplied YAML config and max_steps override. Single-GPU\
          \ inside\n    the KFP component container. For multi-node distributed training,\
          \ use\n    openshift/training/pytorchjob.yaml (KFTO PyTorchJob) instead\
          \ -- the KFP\n    pipeline can submit a PyTorchJob and poll for completion\
          \ via the\n    Kubernetes client (documented as a future enhancement).\n\
          \n    corpus_dir is an explicit typed input derived from tokenize_transactions.\n\
          \    The data dependency ensures this component waits for tokenization to\n\
          \    complete before launching training -- the corpus files must exist before\n\
          \    the NeMo dataloader opens them.\n\n    Better than papermill: max_steps\
          \ is a typed pipeline parameter recorded in\n    the KFP metadata store.\
          \ You can compare runs and see exactly how many steps\n    each training\
          \ run executed, not just \"notebook 03 ran.\"\n\n    Parameters\n    ----------\n\
          \    work_dir    : str  -- repo root on the shared PVC\n    corpus_dir \
          \ : str  -- path returned by tokenize_transactions (data dependency)\n \
          \   config_path : str  -- path to NeMo YAML config, relative to work_dir\n\
          \    max_steps   : int  -- training steps (30 = demo, increase for real\
          \ training)\n\n    Returns\n    -------\n    str\n        Absolute path\
          \ to models/decoder-demo/checkpoints/ on the shared PVC.\n    \"\"\"\n \
          \   import os\n    import sys\n    import subprocess\n\n    # True decorated\
          \ component -- calls src/ directly.\n    sys.path.insert(0, work_dir)\n\
          \    os.environ[\"HOME\"] = \"/tmp\"\n\n    if force_rerun:\n        import\
          \ shutil\n        checkpoint_dir_to_clear = os.path.join(work_dir, \"models\"\
          , \"decoder-demo\")\n        if os.path.exists(checkpoint_dir_to_clear):\n\
          \            shutil.rmtree(checkpoint_dir_to_clear)\n            print(\"\
          force_rerun=True -- cleared existing decoder-demo checkpoint\")\n\n    abs_config\
          \   = os.path.join(work_dir, config_path)\n    train_script = os.path.join(work_dir,\
          \ \"scripts\", \"train_decoder_model.py\")\n    train_corpus = os.path.join(corpus_dir,\
          \ \"train_corpus.txt\")\n    val_corpus   = os.path.join(corpus_dir, \"\
          val_corpus.txt\")\n\n    print(f\"NeMo pretraining: max_steps={max_steps}\"\
          )\n    print(f\"  Config:         {abs_config}\")\n    print(f\"  Train\
          \ corpus:   {train_corpus}\")\n    print(f\"  Val corpus:     {val_corpus}\"\
          )\n\n    env = os.environ.copy()\n    env[\"PYTHONPATH\"] = work_dir + \"\
          :\" + env.get(\"PYTHONPATH\", \"\")\n\n    cmd = [\n        \"torchrun\"\
          , \"--nproc-per-node=1\",\n        train_script,\n        \"-c\", abs_config,\n\
          \        f\"--dataset.data_path={train_corpus}\",\n        f\"--validation_dataset.data_path={val_corpus}\"\
          ,\n        f\"--step_scheduler.max_steps={max_steps}\",\n    ]\n\n    subprocess.run(cmd,\
          \ check=True, cwd=work_dir, env=env)\n\n    checkpoint_dir = os.path.join(work_dir,\
          \ \"models\", \"decoder-demo\", \"checkpoints\")\n    print(f\"Training\
          \ complete. Checkpoint dir: {checkpoint_dir}\")\n    return checkpoint_dir\n\
          \n"
        env:
        - name: HOME
          value: /tmp
        image: image-registry.openshift-image-registry.svc:5000/nemo-tfm/nemo-tfm-workbench:latest
        resources:
          accelerator:
            count: '1'
            resourceCount: '1'
            resourceType: nvidia.com/gpu
            type: nvidia.com/gpu
          cpuRequest: 8.0
          memoryRequest: 64.0
          resourceCpuRequest: '8'
          resourceMemoryRequest: 64G
pipelineInfo:
  description: Decorated KFP v2 pipeline -- typed I/O components calling src/ directly.
    Contrast with nemo-transaction-foundation-model (papermill version).
  name: nemo-tfm-foundation-model-decorated
root:
  dag:
    tasks:
      condition-branches-1:
        componentRef:
          name: comp-condition-branches-1
        dependentTasks:
        - tokenize-transactions
        inputs:
          parameters:
            pipelinechannel--force_rerun:
              componentInputParameter: force_rerun
            pipelinechannel--max_steps:
              componentInputParameter: max_steps
            pipelinechannel--mode:
              componentInputParameter: mode
            pipelinechannel--model_path:
              componentInputParameter: model_path
            pipelinechannel--tokenize-transactions-Output:
              taskOutputParameter:
                outputParameterKey: Output
                producerTask: tokenize-transactions
            pipelinechannel--work_dir:
              componentInputParameter: work_dir
        taskInfo:
          name: condition-branches-1
      prepare-dataset:
        cachingOptions: {}
        componentRef:
          name: comp-prepare-dataset
        inputs:
          parameters:
            force_rerun:
              componentInputParameter: force_rerun
            work_dir:
              componentInputParameter: work_dir
        taskInfo:
          name: prepare-dataset
      tokenize-transactions:
        cachingOptions: {}
        componentRef:
          name: comp-tokenize-transactions
        dependentTasks:
        - prepare-dataset
        inputs:
          parameters:
            force_rerun:
              componentInputParameter: force_rerun
            work_dir:
              componentInputParameter: work_dir
        taskInfo:
          name: tokenize-transactions
  inputDefinitions:
    parameters:
      force_rerun:
        defaultValue: false
        description: 'embeddings if present -- makes repeated runs fast.

          True: clear and regenerate all intermediate outputs.

          Always set True for train mode to avoid stale demo

          artifacts contaminating results.'
        isOptional: true
        parameterType: BOOLEAN
      max_steps:
        defaultValue: 30.0
        description: '30   = demo capability proof (fast).

          500+ = meaningful training.

          3000 = full NVIDIA equivalent (use H200s).'
        isOptional: true
        parameterType: NUMBER_INTEGER
      mode:
        defaultValue: demo
        description: or "train" (all steps including NeMo pretraining).
        isOptional: true
        parameterType: STRING
      model_path:
        defaultValue: models/decoder-foundation-model
        description: 'Default: models/decoder-foundation-model/ (Git LFS,

          3000-step NVIDIA checkpoint). Relative paths are

          resolved from work_dir inside extract_embeddings.'
        isOptional: true
        parameterType: STRING
      work_dir:
        defaultValue: /opt/app-root/src/nemo-tfm
        isOptional: true
        parameterType: STRING
