        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.13.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef tokenize_transactions(work_dir: str) -> str:\n    \"\"\"Run the\
          \ GPU-accelerated financial tokeniser and write text corpora.\n\n    True\
          \ decorated component \u2014 calls src/ directly.\n    Contrast with nemo_tfm_pipeline.py\
          \ which uses papermill to run the\n    equivalent notebook (02_seq_preproc_tokenization.ipynb).\n\
          \n    Reads the temporal splits from data/TabFormer/temporal_split/ (produced\n\
          \    by notebook 01), runs FinancialTokenizerPipeline.preprocess() to derive\n\
          \    the 12 pipeline columns, then calls fit_transform() and to_corpus_lines()\n\
          \    to produce text sequences in the format expected by NeMo AutoModel:\n\
          \n        <bos> AMT_3 MERCH_1498 CAT_RETAIL ... CUST_42 <sep> AMT_1 ...\
          \ <eos>\n\n    Each line is ~315 transactions (~4096 tokens at 12 tok/txn\
          \ + separators),\n    matching the model's context window. Three corpus\
          \ files are written:\n    train_corpus.txt, val_corpus.txt, test_corpus.txt.\n\
          \n    Better than papermill: the corpus directory path is a typed return\
          \ value\n    recorded in KFP's metadata store. The notebook version writes\
          \ wherever\n    the cell says, with no typed contract visible to downstream\
          \ steps.\n\n    Returns\n    -------\n    str\n        Absolute path to\
          \ data/decoder_corpus/ on the shared PVC.\n    \"\"\"\n    import os\n \
          \   import sys\n    import time\n\n    # True decorated component \u2014\
          \ calls src/ directly.\n    sys.path.insert(0, work_dir)\n    os.environ[\"\
          HOME\"] = \"/tmp\"\n\n    import cudf\n    from src.tokenizer import FinancialTokenizerPipeline\n\
          \n    MERCHANT_HASH_SIZE = 2000\n    CHUNK_SIZE = 315  # ~4096 tokens at\
          \ 12 tokens/txn + separators\n\n    temporal_dir = os.path.join(work_dir,\
          \ \"data\", \"TabFormer\", \"temporal_split\")\n    corpus_dir   = os.path.join(work_dir,\
          \ \"data\", \"decoder_corpus\")\n    os.makedirs(corpus_dir, exist_ok=True)\n\
          \n    splits = [\n        (\"train\", os.path.join(temporal_dir, \"train.parquet\"\
          ),\n                  os.path.join(corpus_dir, \"train_corpus.txt\")),\n\
          \        (\"val\",   os.path.join(temporal_dir, \"val.parquet\"),\n    \
          \              os.path.join(corpus_dir, \"val_corpus.txt\")),\n        (\"\
          test\",  os.path.join(temporal_dir, \"test.parquet\"),\n               \
          \   os.path.join(corpus_dir, \"test_corpus.txt\")),\n    ]\n\n    for split_name,\
          \ parquet_path, corpus_path in splits:\n        if os.path.exists(corpus_path):\n\
          \            n_lines = sum(1 for _ in open(corpus_path))\n            print(f\"\
          [{split_name}] Corpus already exists: {n_lines:,} sequences \u2014 skipping\"\
          )\n            continue\n\n        print(f\"\\n{'='*60}\")\n        print(f\"\
          Generating corpus for {split_name}\")\n        print(f\"{'='*60}\")\n\n\
          \        t0 = time.time()\n        gdf = cudf.read_parquet(parquet_path)\n\
          \        print(f\"  Loaded {len(gdf):,} rows in {time.time()-t0:.1f}s\"\
          )\n\n        pip = FinancialTokenizerPipeline(merchant_hash_size=MERCHANT_HASH_SIZE)\n\
          \        gdf_proc = pip.preprocess(gdf)\n        pip.fit(gdf_proc)\n   \
          \     token_df = pip.transform(gdf_proc)\n\n        # Identify group columns\
          \ for chunking by (user, card)\n        group_cols = []\n        for col_name\
          \ in [\"user\", \"User\", \"cust\"]:\n            if col_name in gdf_proc.columns:\n\
          \                group_cols.append(col_name)\n                break\n  \
          \      for col_name in [\"card\", \"Card\", \"card_id\"]:\n            if\
          \ col_name in gdf_proc.columns:\n                group_cols.append(col_name)\n\
          \                break\n        if not group_cols:\n            group_cols\
          \ = [gdf_proc.columns[0]]\n\n        corpus_lines = pip.to_corpus_lines(\n\
          \            token_df, gdf_proc, group_cols, chunk_size=CHUNK_SIZE\n   \
          \     )\n\n        with open(corpus_path, \"w\") as f:\n            for\
          \ line in corpus_lines:\n                f.write(line + \"\\n\")\n\n   \
          \     elapsed = time.time() - t0\n        print(f\"  Generated {len(corpus_lines):,}\
          \ sequences in {elapsed:.1f}s\")\n        print(f\"  Saved \u2192 {corpus_path}\"\
          )\n\n    return corpus_dir\n\n"
